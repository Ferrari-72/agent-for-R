max_iterations: 15
stop_on_llm_error: true
checkpoint_interval: 1
random_seed: 42
log_level: INFO
diff_based_evolution: true
enforce_evolve_blocks: true
max_code_length: 12000

llm:
  models:
    - name: deepseek-ai/DeepSeek-V3.2
      weight: 1.0
  api_base: https://api.siliconflow.cn/v1
  api_key: ${OPENAI_API_KEY}
  temperature: 0.7
  max_tokens: 2048
  extra_body:
    enable_thinking: false
  timeout: 75
  retries: 0

prompt:
  template_dir: prompts
  num_top_programs: 2
  num_diverse_programs: 2
  failure_feedback_strategy: openevolve_recent
  use_template_stochasticity: false
  system_message: >-
    Improve the contraction path search algorithm. Keep the find_path(inputs,
    output, sizes, seed=0) signature. Return exactly len(inputs)-1 pairs of
    integer positions in the current tensor list. After each pair, the two
    tensors are removed and their result is appended. Always retain a valid
    fallback path. Use only installed packages and real APIs. In opt_einsum
    3.4.0, oe.paths.greedy(inputs, output, sizes) has NO seed parameter.
    oe.RandomGreedy(max_repeats=32, parallel=False) is callable with inputs,
    output, sizes. cotengra.ContractionTree.from_path(inputs, output, sizes,
    path=path, check=True, autocomplete=False) can score a valid path with
    contraction_cost(). A tree can be refined with simulated_anneal(seed=0,
    tsteps=20, numiter=20, minimize="flops") and converted back with
    get_path(), but any extracted path must be independently passed through
    from_path(check=True, autocomplete=False) before it is returned. Never
    trust tree.cost or path length as a legality check. Never use
    oe.RandomGreedy or any other uncontrolled random source: the same inputs,
    output, sizes, and seed must return the identical path on every call. All
    randomness, if used, must be explicitly derived from seed. Always keep a
    known-valid greedy fallback and return it whenever refinement, validation,
    or cost comparison fails. The evaluator checks legality and rewards lower
    contraction cost. Candidate path search must finish within 10 seconds.
    Your response must start immediately with the literal seven '<'
    characters of a complete diff block: <<<<<<< SEARCH. Do not output a
    standalone line containing SEARCH, REPLACE, or any explanation before the
    first diff block. Output exactly one SEARCH/REPLACE block and end
    immediately after >>>>>>> REPLACE. Use no Markdown code fences and do not
    merely describe a solution.

database:
  num_islands: 1
  population_size: 10
  archive_size: 5
  log_prompts: true

evaluator:
  timeout: 90
  max_retries: 0
  cascade_evaluation: false
  parallel_evaluations: 1
  use_llm_feedback: false

evolution_trace:
  enabled: true
  format: jsonl
  include_code: true
  include_prompts: true
